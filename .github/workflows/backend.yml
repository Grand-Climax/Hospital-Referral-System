# This workflow will build a backend project using golang that's containerized through docker

name: CI/CD pipeline for backend

on:
  push:
    branches: [ "main", "backend.main" ]
  pull_request:
    branches: [ "main" ,  "backend.main"]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25'

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...

    
