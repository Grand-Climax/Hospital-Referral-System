# This workflow will build a backend project using golang that's containerized through docker

name: CI/CD pipeline for backend

on:
  push:
    branches: [ "main", "backend.main" ]
  pull_request:
    branches: [ "main" ,  "backend.main"]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.23'

    - name: Build
      working-directory: ./backend
      run: go build -v ./...

    - name: Test
      working-directory: ./backend
      run: go test -v ./...

    - name: Docker build
      working-directory: ./backend
      run: docker build -t docker_image .

    - name: Debug secrets length
      run: |
       echo "Username length: ${#DOCKER_USERNAME}"
       echo "Password length: ${#DOCKER_PASSWORD}"
      env:
         DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
         DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

    - name: Log in to DockerHub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Push Docker Image
      run: |
          docker tag hospital-referral mennaye/hospital-referral-system:latest
          docker push mennaye/hospital-referral-system:latest

    
