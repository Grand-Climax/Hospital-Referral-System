  /api/v1/referrals/{id}/attachments:
    get:
      description: |-
        Get all attachments associated with a specific referral.
        **Roles:** All authenticated roles with referral access.
        **Common Errors:**
        - 404 Referral not found
      parameters:
      - description: Referral ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AttachmentListResponse'
      security:
      - BearerAuth: []
      summary: List Referral Attachments
      tags:
      - Attachments
    post:
      consumes:
      - application/json
      - multipart/form-data
      description: |-
        Supports two modes for associating clinical data with a referral:
        1. **Hybrid/Bulk JSON**: Register multiple files already uploaded to Cloudinary.
        - Requires the `referral_id` pre-minted from the `/attachments/signature` endpoint.
        - Files MUST be at the `temp/{referral_id}/` path in Cloudinary.
        2. **Direct File**: Upload a single file (Max 20MB) directly to the backend.
        **Roles:** REFERRING_DOCTOR
        **Prerequisites:** Allowed only when referral status is DRAFT or NEED_REVISION.
        **Common Errors:**
        - 400 Invalid ID or file too large
        - 403 Forbidden (not the creator or invalid status)
      parameters:
      - description: Referral ID (Pre-minted or Existing)
        in: path
        name: id
        required: true
        type: string
      - description: Bulk JSON payload for Hybrid Flow
        in: body
        name: body
        schema:
          $ref: '#/definitions/dto.BulkAttachmentRequest'
      - description: Direct file upload payload
        in: formData
        name: file
        type: file
      - description: Category (e.g. RADIOLOGY, LAB_REPORT, DICOM_XRAY)
        in: formData
        name: category
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.AttachmentListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Register or Upload Referral Attachments
      tags:
      - Attachments
  /api/v1/referrals/{id}/attachments/{attachment_id}:
    delete:
      description: |-
        Remove attachment from referral.
        **Roles:** REFERRING_DOCTOR
        **Prerequisites:** Only allowed for Draft/NeedRevision status by the referring doctor.
        **Common Errors:**
        - 403 Forbidden (invalid status or not owner)
      parameters:
      - description: Referral ID
        in: path
        name: id
        required: true
        type: string
      - description: Attachment ID
        in: path
        name: attachment_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete Attachment From Referral
      tags:
      - Attachments
