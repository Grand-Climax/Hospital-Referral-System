      consumes:
      - application/json
      description: |-
        Schedule an emergency appointment bypassing buffer days and allowing overbooking.
        **Roles:** RECEIVING_SPECIALIST
        **Prerequisites:** referral must be accepted; condition must be `critical` OR justification provided.
        **State Transition:** Sets appointment_date, bypasses buffer, allows overbooking.
        **Gatekeepers:** Allows overbooking up to `overbook_limit`.
        **Common Errors:**
        - 400 invalid format
        - 500 internal error
      parameters:
      - description: Referral ID
        in: path
        name: id
        required: true
        type: string
      - description: Scheduling details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.ManualEmergencyScheduleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Manual Emergency Scheduling
      tags:
      - Specialist
