      description: |-
        Revoke both access and refresh tokens. Blacklists the tokens to prevent further use.
        **Roles:** Any authenticated user.
        **Prerequisites:** Requires a valid Access Token in Authorization header.
        **Common Errors:**
        - 401 Unauthorized
        - 500 Internal Server Error
      parameters:
      - description: Refresh token to revoke
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: User logout
      tags:
      - Auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: |-
        Exchange a valid refresh token for a new access/refresh token pair. Used to maintain session without re-login.
        **Roles:** Any user with a valid refresh token.
        **Constraints:** Refresh token must not be blacklisted or expired.
        **Common Errors:**
        - 401 Unauthorized (token invalid/expired)
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: New token pair
          schema:
            $ref: '#/definitions/dto.RefreshResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Refresh token
      tags:
      - Auth
