      tags:
      - Specialist
  /api/v1/specialist/referrals/{id}/accept:
    post:
      consumes:
      - application/json
      description: |-
        Accept the referral and place it in the triage queue.
        **Roles:** RECEIVING_SPECIALIST
        **Prerequisites:** status = UNDER_SPECIALIST_REVIEW; severity score must be set (manual or ML).
        **State Transition:** → ACCEPTED; lands in triage queue.
        **Gatekeepers:** Severity gate (manual or ML score must exist).
        **Common Errors:**
        - 400 invalid format
        - 422 (no severity score)
      parameters:
      - description: Referral ID
        in: path
        name: id
        required: true
        type: string
      - description: 'Severity Score (key: severity_score)'
        in: body
        name: request
        schema:
          additionalProperties:
            format: float64
            type: number
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Accept Referral
      tags:
      - Specialist
