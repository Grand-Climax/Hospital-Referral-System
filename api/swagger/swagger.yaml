        in: query
        name: patient_name
        type: string
      - description: Sort order (asc/desc)
        in: query
        name: sort
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PaginatedReferralResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List Referrals for Doctor
      tags:
      - Doctor Referrals
    post:
      consumes:
      - application/json
      description: |-
        Finalizes a referral that was initiated via the `signature` endpoint.

        ### Hybrid-Upload Flow:
        1. **Aquire ID**: Call `/api/v1/attachments/signature` to get a `referral_id`.
        2. **Direct Upload**: Upload clinical data (X-rays, etc.) to Cloudinary using that `referral_id` as context.
        3. **Finalize**: Call this endpoint with the same `id` to register the referral.

        ### Status Guide:
        - Use `status=DRAFT` to save information without entering the review pipeline.
        - Use `status=SUBMITTED` to officially send the referral to the hospital Liaison.
        ### Rules:
        - Role: DOCTOR (Sender hospital)
        - Constraint: Cannot create a new referral if the patient already has an active referral (not COMPLETED, CANCELLED, REJECTED_*, DECEASED) for the same target department.
        - Errors: 409 (Conflict if active referral exists).
      parameters:
      - description: Referral Details (Include pre-minted referral_id)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateReferralRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.ReferralCreationResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create or Submit Referral (Pre-Minted Architecture)
      tags:
      - Doctor Referrals
