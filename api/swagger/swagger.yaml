  /api/v1/attachments/signature:
    get:
      description: |-
        The first step in creating/updating a referral with attachments.
        1. Generates a unique **Pre-Minted Referral ID**.
        2. Provides a cryptographic signature for Cloudinary.
        3. Frontend MUST upload files to the folder path: `temp/{referral_id}/`.
        4. Use the returned `referral_id` when calling the Referral Creation API.
        **Roles:** REFERRING_DOCTOR
        **Common Errors:**
        - 500 Internal Server Error
      parameters:
      - description: Existing Referral ID (for updates)
        in: query
        name: referral_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UploadSignatureResponse'
        "500":
