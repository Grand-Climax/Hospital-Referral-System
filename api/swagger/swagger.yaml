        Reject the referral back to the referring hospital.
        **Roles:** RECEIVING_SPECIALIST
        **Prerequisites:** status = UNDER_SPECIALIST_REVIEW.
        **State Transition:** → REJECTED_BY_SPECIALIST.
        **Common Errors:**
        - 400 invalid format
        - 403 unauthorized hospital access
      parameters:
      - description: Referral ID
        in: path
        name: id
        required: true
        type: string
      - description: Rejection Reason
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RejectDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Reject Referral
      tags:
      - Specialist
  /api/v1/specialist/referrals/{id}/release:
    post:
      consumes:
      - application/json
      description: |-
        Unassign self and return the referral to the hospital pool.
        **Roles:** RECEIVING_SPECIALIST (Assigned)
        **Prerequisites:** status = UNDER_SPECIALIST_REVIEW.
        **State Transition:** → FORWARDED.
        **Common Errors:**
        - 400 invalid format
        - 403 unauthorized access
      parameters:
      - description: Referral ID
        in: path
        name: id
        required: true
        type: string
      - description: Reason for Release (Reason field reused)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RejectDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Release Referral (Unassign Self)
      tags:
      - Specialist
  /api/v1/specialist/referrals/{id}/rerun-ml:
    post:
      description: |-
        Rerun the machine learning prediction for a specific referral.
        **Roles:** RECEIVING_SPECIALIST
        **Prerequisites:** Status must be FORWARDED or UNDER_SPECIALIST_REVIEW.
        **Common Errors:**
        - 400 invalid format
        - 403 unauthorized hospital access
      parameters:
      - description: Referral ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Rerun ML Prediction
      tags:
      - Specialist
  /api/v1/specialist/referrals/{id}/schedule:
    post:
      consumes:
      - application/json
      description: |-
        Manually assigns an appointment date to a referral. Use this for routine scheduling after acceptance.
        **Roles:** RECEIVING_SPECIALIST
        **Prerequisites:** status = ACCEPTED.
        **State Transition:** → SCHEDULED.
        **Common Errors:**
        - 400 invalid format
        - 500 internal error
      parameters:
      - description: Referral ID
        in: path
        name: id
        required: true
        type: string
      - description: Scheduling details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.SchedulingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.BaseResponse'
      security:
      - BearerAuth: []
      summary: Schedule Appointment
      tags:
      - Specialist
  /api/v1/specialist/referrals/{id}/triage-review:
    post:
      consumes:
      - application/json
      description: |-
        Allows a specialist to review and finalize the ML-generated triage score (APPROVE/OVERRIDE/REJECT).
        **Roles:** RECEIVING_SPECIALIST
        **Prerequisites:** Referral must have an ML prediction or manual score set.
        **State Transition:** Finalizes the triage state for the referral.
        **Common Errors:**
        - 400 invalid format or input
        - 401 Unauthorized
        - 500 Internal Server Error
      parameters:
      - description: Referral ID
        in: path
        name: id
        required: true
        type: string
      - description: Review details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.TriageReviewRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.BaseResponse'
      security:
      - BearerAuth: []
      summary: Review Triage Prediction
      tags:
      - Triage
  /api/v1/specialist/referrals/{id}/triage-severity:
    post:
      consumes:
      - application/json
      description: |-
        Manually set the severity score for a referral. Overrides ML score and updates triage queue.
        **Roles:** RECEIVING_SPECIALIST
        **Prerequisites:** referral must exist and be under the specialist's purview.
        **Side Effect:** Overrides ML score, updates triage queue composite score.
        **Common Errors:**
        - 400 invalid format
        - 403 unauthorized hospital access
      parameters:
      - description: Referral ID
        in: path
        name: id
        required: true
        type: string
      - description: Severity details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.SetManualSeverityRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Set Manual Severity Score
      tags:
      - Specialist
  /api/v1/specialist/referrals/capacity:
    get:
      description: |-
        View capacity slots for the next N days.
        **Roles:** RECEIVING_SPECIALIST
        **Prerequisites:** Authenticated session in a hospital/department.
        **Common Errors:**
        - 401 Unauthorized
        - 500 Internal Server Error
      parameters:
      - default: 14
        description: Number of days to view
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get Department Capacity Status
      tags:
      - Specialist
  /api/v1/specialist/referrals/triage-queue:
    get:
      description: |-
        Get the current prioritized triage queue for the specialist's hospital.
        **Roles:** RECEIVING_SPECIALIST
        **Prerequisites:** Authenticated session in a hospital.
        **Gatekeepers:** Sorting based on severity score and waiting time.
        **Common Errors:**
        - 401 Unauthorized
        - 500 Internal Server Error
      parameters:
      - default: 50
        description: Pagination limit
        in: query
        name: limit
        type: integer
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get Triage Queue
      tags:
      - Specialist
  /api/v1/system-admin/referrals:
    get:
      description: |-
        Get a global paginated list of all referrals with optional status filtering.
        **Roles:** SYSTEM_SUPER_ADMIN
        **Visibility:** Global - across all hospitals and departments.
        **Common Errors:**
        - 400 Invalid status
        - 401 Unauthorized
        - 500 Internal Server Error
      parameters:
      - default: 20
        description: Pagination limit
        in: query
        name: limit
        type: integer
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - description: Filter by status
        in: query
        name: status
        type: string
      - description: Filter by patient region
        in: query
        name: region
        type: string
      - description: Filter by patient name (any order)
        in: query
        name: patient_name
        type: string
      - description: Sort order (asc/desc)
        in: query
        name: sort
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PaginatedReferralResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: System Admin Global Listing
      tags:
      - Admin Referrals
  /api/v1/system-admin/users:
    get:
      description: |-
        Administrative-only endpoint for global user discovery across all hospitals.
        **Roles:** SYSTEM_SUPER_ADMIN
        **Visibility:** Global access to all users.
        **Common Errors:**
        - 403 Forbidden (not super admin)
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Page size
        in: query
        name: page_size
        type: integer
      - description: Tokenized name search
        in: query
        name: name
        type: string
      - description: Filter by email
        in: query
        name: email
        type: string
      - description: Filter by Hospital ID
        in: query
        name: hospital_id
        type: string
      - description: Filter by Department ID
        in: query
        name: dept_id
        type: string
      - description: Filter by role
        in: query
        name: role
        type: string
      - description: Filter by active status
        in: query
        name: is_active
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UserListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Global User List (System Admin Only)
      tags:
      - SystemAdmin
    post:
      consumes:
      - application/json
      description: |-
        Admin-only endpoint to create a new user account.
        **Roles:** SYSTEM_SUPER_ADMIN
        **Common Errors:**
        - 400 invalid input
        - 409 conflict (email/national_id)
      parameters:
      - description: User creation payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a new user
      tags:
      - SystemAdmin
  /api/v1/system-admin/users/{id}:
    delete:
      description: |-
        Admin-only endpoint to soft-delete a user.
        **Roles:** SYSTEM_SUPER_ADMIN
        **Common Errors:**
        - 404 Not Found
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a user
      tags:
      - SystemAdmin
    put:
      consumes:
      - application/json
      description: |-
        Admin-only endpoint to update a user's information.
        **Roles:** SYSTEM_SUPER_ADMIN
        **Common Errors:**
        - 400 invalid input
        - 404 Not Found
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: User update payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a user
      tags:
      - SystemAdmin
  /api/v1/system-admin/users/{id}/profile/image:
    delete:
      description: |-
        Remove a user's profile image (SystemAdmin or HospitalAdmin only).
        **Roles:** SYSTEM_SUPER_ADMIN, HOSPITAL_ADMIN
        **Prerequisites:** Hospital Admin can only moderate users in their own hospital.
        **Common Errors:**
        - 403 Forbidden (out of scope)
      parameters:
      - description: User ID to moderate
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Moderate Profile Image
      tags:
      - SystemAdmin
  /api/v1/system-admin/users/{id}/role:
    patch:
      consumes:
      - application/json
      description: |-
        Admin-only endpoint to change a user's role.
        **Roles:** SYSTEM_SUPER_ADMIN
        **Common Errors:**
        - 400 invalid role
        - 404 Not Found
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: Role assignment payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.AssignRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Assign role to user
      tags:
      - SystemAdmin
  /api/v1/triage:
    get:
      description: |-
        Returns a prioritized list of patients waiting for triage for the specialist's hospital.
        **Roles:** RECEIVING_SPECIALIST
        **Sorting:** Severity score descending, waiting time ascending.
        **Common Errors:**
        - 401 Unauthorized
        - 500 Internal Server Error
      parameters:
      - default: 10
        description: Pagination limit
        in: query
        name: limit
        type: integer
      - default: 0
        description: Pagination offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.BaseResponse'
      security:
      - BearerAuth: []
      summary: List Triage Queue
      tags:
      - Triage
  /api/v1/users:
    get:
      description: |-
        Retrieve a list of users within your own hospital.
        **Roles:** Hospital Admins, Doctors, Specialists, Liaisons
        **Visibility:** MOH Analysts are strictly forbidden. Users see only others in the same hospital.
        **Common Errors:**
        - 403 Forbidden for MOH Analysts
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Page size
        in: query
        name: page_size
        type: integer
      - description: Filter by role
        in: query
        name: role
        type: string
      - description: Tokenized name search (e.g. 'Doe John')
        in: query
        name: name
        type: string
      - description: Filter by partial email
        in: query
        name: email
        type: string
      - description: Filter by Department ID
        in: query
        name: dept_id
        type: string
      - description: Filter by active status
        in: query
        name: is_active
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UserListResponse'
        "403":
          description: Forbidden for MOH Analysts
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List users (Hospital-Scoped)
      tags:
      - Users
  /api/v1/users/{id}:
    get:
      description: |-
        Retrieve detailed profile of a user with nuanced visibility rules.
        **Roles:** All authenticated roles (with visibility rules).
        **Visibility Rules:**
        - System Admins: Can view any profile.
        - Clinical roles: Can view each other across hospitals (for referrals).
        - Clinical roles: Cannot view SystemAdmins or Receptionists from other hospitals.
        - Receptionists: Can ONLY view users within their own hospital.
        - MOH Analysts: Cannot view any user except their own.
        **Common Errors:**
        - 403 visibility violation
        - 404 Not Found
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UserResponse'
        "403":
          description: Forbidden due to visibility restrictions
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get user by ID
      tags:
      - Users
  /api/v1/users/me:
    get:
      description: |-
        Returns the profile of the currently authenticated user.
        **Roles:** Any authenticated user.
        **Common Errors:**
        - 401 Unauthorized
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get current user's profile
      tags:
      - Users
  /api/v1/users/profile/image:
    delete:
      description: |-
        Remove the current user's profile image (unsets URL and PublicID).
        **Roles:** Any authenticated user.
        **Common Errors:**
        - 401 Unauthorized
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete own Profile Image
      tags:
      - Users
    put:
      consumes:
      - multipart/form-data
      description: |-
        Update the current user's profile image by uploading a file (Max 5MB: JPEG, PNG, WEBP).
        **Roles:** Any authenticated user.
        **Constraints:** Max 5MB, format must be JPEG, PNG, or WEBP.
        **Common Errors:**
        - 400 invalid size/format
      parameters:
      - description: Profile image file
        in: formData
        name: image
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update Profile Image
      tags:
      - Users
securityDefinitions:
  BearerAuth:
    description: Enter your bearer token in the format **Bearer &lt;token&gt;**
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
