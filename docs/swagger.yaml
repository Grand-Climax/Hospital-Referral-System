    post:
      description: |-
        Acknowledge receipt and mark the referral as read by the liaison.
        **Roles:** LIAISON_OFFICER
        **Prerequisites:** referral.status must be SUBMITTED.
        **State Transition:** SUBMITTED → UNDER_LIAISON_REVIEW.
        **Common Errors:**
        - 400 invalid format
        - 403 (not sender hospital)
      parameters:
      - description: Referral ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Mark Referral as Read
      tags:
      - Liaison
