  /api/v1/me/notifications:
    get:
      description: |-
        Retrieve a paginated list of in-app notifications targeting the current authenticated user.

        ### Query Options & Extensive Filters:
        - **`limit`**: Controls size of paginated array (sanitized to safe positive default of 20).
        - **`page`**: Page number to load (sanitized to safe positive default of 1).
        - **`event_type`**: Filter by event trigger keys (e.g. `STAFF_ADDED`, `REFERRAL_SUBMITTED`, `CLINICAL_UPDATE_ADDED`, `APPOINTMENT_SCHEDULED`, `PATIENT_DECEASED`, `BATCH_SCHEDULE_COMPLETED`).
        - **`is_read`**: Filter by read (`true`) or unread (`false`) state.
        - **`referral_id`**: Scopes search to notifications belonging to a specific clinical referral context.
        - **`start_date` / `end_date`**: Range bounds targeting the creation timestamp (format: `YYYY-MM-DD`). End date is automatically extended to 23:59:59 of that day.
        - **`search`**: Full-text fuzzy search matched against the notification title or description message.
      parameters:
      - default: 20
        description: Pagination limit
        in: query
        name: limit
        type: integer
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - description: Filter by exact system event type string
        in: query
        name: event_type
        type: string
      - description: Filter by read/unread status
        in: query
        name: is_read
        type: boolean
      - description: Filter by referral UUID
        in: query
        name: referral_id
        type: string
      - description: Filter start bounds (YYYY-MM-DD)
        in: query
        name: start_date
        type: string
      - description: Filter end bounds (YYYY-MM-DD)
        in: query
        name: end_date
        type: string
      - description: Fuzzy text search in title and message text
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.PaginatedNotificationResponse'
        "401":
          description: 'Unauthorized: Invalid or expired session token'
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ErrorResponse'
        "500":
          description: Internal repository query failure
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List My In-App Notifications
      tags:
      - In-App Notifications
  /api/v1/me/notifications/{id}/read:
    post:
      description: |-
        Mark a specific in-app notification as read for the authenticated user.

        ### Ownership Verification:
        - The system validates that the target notification record belongs to the calling user (`user_id = userID`).
        - Attempts to mark another user's notification as read are rejected.
      parameters:
      - description: Notification UUID to mark as read
        in: path
        name: id
        required: true
        type: string
      produces:
