      - description: Rejection Reason
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.RejectDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
