      description: |-
        Remove attachment from referral.
        **Roles:** REFERRING_DOCTOR
        **Prerequisites:** Only allowed for Draft/NeedRevision status by the referring doctor.
        **Common Errors:**
        - 403 Forbidden (invalid status or not owner)
      parameters:
      - description: Referral ID
        in: path
        name: id
        required: true
        type: string
      - description: Attachment ID
        in: path
        name: attachment_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.BaseResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete Attachment From Referral
      tags:
      - Attachments
