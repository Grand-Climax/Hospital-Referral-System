      consumes:
      - application/json
      description: |-
        Add a clinical progress note to the referral.
        **Roles:** Requires clinical access (treating or consulted doctor).
        **Prerequisites:** Specialist must be assigned or have explicit access grant.
        **Side Effect:** If update_reason is CONDITION_CHANGE or MISSED_APPOINTMENT_RE_EVALUATION, the `requires_review` flag is set.
        **Common Errors:**
        - 400 invalid format
        - 403 (no clinical access)
      parameters:
      - description: Referral ID
        in: path
        name: id
        required: true
        type: string
      - description: Update details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.AddClinicalUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Add Clinical Update
      tags:
      - Clinical
  /api/v1/referrals/{id}/deceased:
    post:
      consumes:
      - application/json
      description: |-
        Immediately closes a referral because the patient has died. Bypasses all status restrictions.
        **Roles:** REFERRING_DOCTOR, LIAISON_OFFICER, RECEIVING_SPECIALIST, SYSTEM_SUPER_ADMIN
        **State Transition:** Any status → DECEASED. Referral is archived and removed from active queues.
      parameters:
      - description: Referral ID
        in: path
        name: id
        required: true
        type: string
      - description: Reason
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.RejectDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Mark Referral as Deceased
      tags:
      - Referrals
  /api/v1/referrals/{id}/redirections:
    get:
      description: |-
        Get a chronological list of all redirections for a specific referral.
        **Access:** Referring Doctor, Sender Liaison, Current Hospital Specialist, System Admin.
      parameters:
      - description: Referral ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ErrorResponse'
      security:
