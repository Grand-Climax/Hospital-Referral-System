  /api/v1/internal/notifications:
    get:
      description: |-
        Retrieve a paginated list of notifications with various filters.
        **Roles:** SYSTEM_SUPER_ADMIN, HOSPITAL_ADMIN, DEPT_HEAD, RECEPTIONIST
        **Scoping:**
        - SYSTEM_SUPER_ADMIN: Global access, can filter by any hospital/department.
        - HOSPITAL_ADMIN: Scoped to their hospital.
        - DEPT_HEAD / RECEPTIONIST: Scoped to their hospital and department.
        **Common Errors:**
        - 401 Unauthorized
        - 403 Forbidden
        - 500 Internal Server Error
        Notification types: ACCEPTANCE (referral accepted), SCHEDULING (appointment scheduled), REMINDER (appointment reminder), RESCHEDULE (appointment changed).
        Delivery status: QUEUED (awaiting auto-send), MANUAL_REQUIRED (needs manual trigger), SENT (sent to provider), FAILED (provider error).
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Page size
        in: query
        name: page_size
        type: integer
      - description: Filter by Referral ID
        in: query
        name: referral_id
        type: string
      - description: Filter by Hospital ID (Ignored if not Super Admin)
        in: query
        name: hospital_id
        type: string
      - description: Filter by Department ID (Ignored if not Super Admin/Hospital
          Admin)
        in: query
        name: department_id
        type: string
      - description: Filter by Notification Type
        enum:
        - ACCEPTANCE
        - SCHEDULING
        - REMINDER
        - RESCHEDULE
        in: query
        name: notif_type
        type: string
      - description: Filter by Delivery Status
        enum:
        - QUEUED
        - MANUAL_REQUIRED
        - SENT
        - FAILED
        in: query
        name: delivery_status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.NotificationListResponse'
      security:
      - BearerAuth: []
      summary: List Notifications
      tags:
      - SMS Notifications
