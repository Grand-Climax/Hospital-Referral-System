        **Roles:** SYSTEM_SUPER_ADMIN
        **Statuses:** REJECTED_BY_LIAISON, REJECTED_BY_SPECIALIST, REJECTED_AFTER_SEND (pre-applied filter).
      parameters:
      - default: 20
        description: Pagination limit
        in: query
        name: limit
        type: integer
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - description: Filter by patient ID
        in: query
        name: patient_id
        type: string
      - description: Filter by patient's national ID
        in: query
        name: national_id
        type: string
      - description: Filter by patient region
        in: query
        name: region
        type: string
      - default: created_at
        description: Sort by field (created_at, updated_at)
        in: query
        name: sort_by
        type: string
      - default: desc
        description: Sort order (asc, desc)
        in: query
        name: sort_order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PaginatedReferralResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List Rejected Referrals (System Admin)
      tags:
      - System Admin
  /api/v1/system-admin/users:
    get:
      description: |-
        Administrative-only endpoint for global user discovery across all hospitals.
        **Roles:** SYSTEM_SUPER_ADMIN
        **Visibility:** Global access to all users.
        **Common Errors:**
        - 403 Forbidden (not super admin)
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Page size
        in: query
        name: page_size
        type: integer
      - description: Tokenized name search
        in: query
        name: name
        type: string
      - description: Filter by email
        in: query
        name: email
        type: string
      - description: Filter by Hospital ID
        in: query
        name: hospital_id
        type: string
      - description: Filter by Department ID
        in: query
        name: dept_id
        type: string
      - description: Filter by role
        in: query
        name: role
        type: string
      - description: Filter by active status
        in: query
        name: is_active
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UserListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Global User List (System Admin Only)
      tags:
      - System Admin
    post:
      consumes:
      - application/json
      description: |-
        Admin-only endpoint to create a new user account.
        **Roles:** SYSTEM_SUPER_ADMIN
        **Common Errors:**
        - 400 invalid input
        - 409 conflict (email/national_id)
      parameters:
      - description: User creation payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a new user
      tags:
      - System Admin
  /api/v1/system-admin/users/{id}:
    delete:
      description: |-
        Admin-only endpoint to soft-delete a user.
        **Roles:** SYSTEM_SUPER_ADMIN
        **Common Errors:**
