    post:
      description: |-
        Forward the referral to specialists at the target hospital.
        **Roles:** LIAISON_OFFICER
        **Prerequisites:** status = SUBMITTED or UNDER_LIAISON_REVIEW; all attachments must be VERIFIED; checklist must be COMPLETE (condition-based).
        **State Transition:** → FORWARDED.
        **Gatekeepers:** Attachment verification; Review Checklist completion.
        **Common Errors:**
        - 400 invalid format / checklist incomplete
        - 403 (wrong hospital)
        - 422 (attachments not verified)
      parameters:
      - description: Referral ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Forward Referral to Specialist
      tags:
      - Liaison
