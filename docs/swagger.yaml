        Mark a patient as arrived. Resolve TriageQueue internally from referral ID.
        **Roles:** RECEPTIONIST
        **Prerequisites:** TriageQueue entry exists, arrival_status = EXPECTED.
        **State Transition:** arrival_status → ARRIVED.
      parameters:
      - description: Referral ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Mark Patient Arrival
      tags:
      - Receptionist
  /api/v1/receptionist/referrals/{id}/assign-doctor:
    post:
      consumes:
      - application/json
      description: |-
        Assign a treating doctor (referring doctor role) to the patient. Resolve TriageQueue internally from referral ID.
        **Roles:** RECEPTIONIST
        **Prerequisites:** queue must be ARRIVED; doctor must be REFERRING_DOCTOR in same hospital.
        **Reassignment:** If a doctor is already assigned, all previous accesses are revoked before new assignment.
        **Side Effect:** Creates ReferralAccess grant and grants clinical access to the assigned doctor.
      parameters:
      - description: Referral ID
        in: path
        name: id
        required: true
        type: string
      - description: Assignment details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.AssignDoctorRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Assign Treating Doctor
      tags:
      - Receptionist
  /api/v1/receptionist/referrals/{id}/miss:
    post:
      consumes:
      - application/json
      description: |-
        Mark an appointment as missed. Resolve TriageQueue internally from referral ID.
        **Roles:** RECEPTIONIST
        **Prerequisites:** queue entry must exist.
        **State Transition:** arrival_status → MISSED; creates ClinicalUpdate for re‑evaluation.
      parameters:
      - description: Referral ID
        in: path
        name: id
        required: true
        type: string
      - description: Miss reason details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.MarkMissedRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Mark Appointment as Missed
      tags:
      - Receptionist
  /api/v1/receptionist/referrals/{id}/return-to-triage:
    post:
      description: |-
        Allows a receptionist to reset a missed patient back to the waiting queue (EXPECTED, no appointment date).
        **Detailed Behavior:**
        - Resets the patient's queue record arrival status from 'MISSED' back to 'EXPECTED' (placing the patient back in the active triage pool).
        - Wipes out the missed appointment date ('AppointmentDate' = nil).
        - Clears the missed reasons and any active doctor assignment details ('AssignedDoctorID' = nil, 'DoctorAssignedAt' = nil).
        - Transactionally updates the underlying Referral status back to 'ACCEPTED' so that the patient is eligible to be scheduled or manually triaged/rescheduled.
        **Roles:** RECEPTIONIST
      parameters:
      - description: TriageQueue ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Return Missed Patient to Triage
      tags:
      - Receptionist
