      description: |-
        Rerun the machine learning prediction for a specific referral.
        **Roles:** RECEIVING_SPECIALIST
        **Prerequisites:** Status must be UNDER_SPECIALIST_REVIEW (unless ML state is failed or stuck pending).
        **Ownership Check:** The specialist must be the one claimed/assigned to the referral.
        **State Transition:** Triggers a forced rerun check and queues the prediction update.
        **Common Errors:**
        - 400 Invalid format
        - 403 Forbidden (wrong hospital or not assigned)
        - 422 Unprocessable Entity (ML service not configured or daily limit exceeded)
      parameters:
      - description: Referral ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Rerun ML Prediction
      tags:
      - Specialist
  /api/v1/specialist/referrals/{id}/return-to-triage:
    post:
      description: |-
        Resets a MISSED patient back to the waiting pool so they can be re-scheduled. Under Schedule-on-Demand this also frees the slot for the original date automatically (capacity is read live from TriageQueue, and Missed rows are excluded from the count).

        **Roles:** RECEIVING_SPECIALIST

        **Prerequisites:** Valid TriageQueue ID; record must currently be MISSED.

        **State Transitions:**
        - TriageQueue.ArrivalStatus: MISSED -> EXPECTED.
        - TriageQueue.AppointmentDate: cleared.
        - TriageQueue.AssignedDoctorID / DoctorAssignedAt: cleared.
        - Referral.Status: -> ACCEPTED (so it is eligible for batch / manual scheduling again).

        **Side Effects:**
        - The slot count for the original date drops by 1 on the next read because the row is no longer Expected/Arrived/Admitted.

        **Common Errors:**
        - 400 invalid ID / record not MISSED
        - 401 Unauthorized
        - 500 Internal Server Error
      parameters:
      - description: TriageQueue ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Return missed patient to triage
      tags:
      - Specialist
  /api/v1/specialist/referrals/{id}/schedule:
    post:
      consumes:
      - application/json
      description: |-
        Books or reschedules a referral for a specific date under the routine capacity rule (no overbooking).

        **Roles:** RECEIVING_SPECIALIST

        **Prerequisites:**
        - Referral.Status must be ACCEPTED or SCHEDULED.
        - TriageQueue.ArrivalStatus must be EXPECTED or MISSED.
        - Appointment date must be today or in the future.

        **Capacity Rule (Schedule-on-Demand):**
        - booked = live TriageQueue count (Expected/Arrived/Admitted) for that (hospital, department, date).
        - maxSlots = active CapacityOverride.NewLimit OR HospitalDepartment.StandardDailyLimit.
        - Rejected when booked >= maxSlots. Overbook capacity is NEVER used here - call /emergency-schedule for that.

        **State Transitions:**
        - Referral.Status: ACCEPTED/SCHEDULED -> SCHEDULED.
        - TriageQueue.ArrivalStatus: MISSED -> EXPECTED (rescheduled_from_missed=true).
        - TriageQueue.AppointmentDate set.

        **Side Effects:**
        - Creates / updates DailySchedule snapshot row.
        - Writes audit log.
        - Queues SMS and in-app notification (APPOINTMENT_SCHEDULED or MISSED_APPOINTMENT_RESCHEDULED).

        **Common Errors:**
        - 400 invalid referral ID / past date / patient already arrived or admitted
        - 401 Unauthorized
        - 500 capacity reached - emergency override required / DB error
      parameters:
      - description: Referral ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Scheduling details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.SchedulingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.SchedulingResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.BaseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.BaseResponse'
      security:
      - BearerAuth: []
      summary: Schedule appointment (routine, Schedule-on-Demand)
      tags:
      - Specialist
  /api/v1/specialist/referrals/{id}/schedule-options:
    get:
      description: |-
        Returns up to N upcoming days starting at today + system_configs.buffer_days where the referral's target department still has routine capacity. Each entry includes max_slots, booked_slots, available_slots, overbook_limit, and whether an active capacity override is in effect.

        **Roles:** RECEIVING_SPECIALIST, REFERRING_DOCTOR

        **Prerequisites:** Referral must exist and have a target hospital + department set.

        **Side Effects:** None. Read-only. The same rule is applied when actually booking, so callers can rely on the dates to be schedulable at the moment of the call (subject to concurrent bookings).

        **Common Errors:**
        - 400 invalid referral ID / days
        - 401 Unauthorized
        - 404 referral not found
        - 500 Internal Server Error
      parameters:
      - description: Referral ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Number of days to scan starting at today + buffer_days (1-60,
          default 14)
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
