        example: 0f74f069-d52d-4482-9ba5-41b007fdc1e5
        type: string
      last_name:
        example: Analyst
        type: string
      national_id:
        example: MOH-001
        type: string
      password:
        example: password123
        minLength: 8
        type: string
      role:
        allOf:
        - $ref: '#/definitions/entity.UserRole'
        example: MOH_ANALYST
    required:
    - email
    - first_name
    - last_name
    - password
    - role
    type: object
  handlers.LinkDepartmentRequest:
    properties:
      daily_limit:
        example: 20
        type: integer
      department_id:
        example: dfc2b777-a5d5-424b-911a-976b2e8d8614
        type: string
    required:
    - department_id
    type: object
  handlers.LoginRequest:
    properties:
      email:
        example: superadmin@moh.gov.et
        type: string
      password:
        example: password123
        type: string
    required:
    - email
    - password
    type: object
  handlers.LogoutRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  handlers.RefreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  handlers.UpdateDepartmentRequest:
    properties:
      description:
        example: Heart and blood vessel diseases
        type: string
      name:
        example: Cardiology
        type: string
    type: object
  handlers.UpdateHospitalRequest:
    properties:
      address:
        example: Churchill Road, Addis Ababa, Ethiopia
        type: string
      contact_phone:
        example: +251 11 111 2233
        type: string
      is_active:
        example: true
        type: boolean
      name:
        example: Tikur Anbessa Specialized Hospital
        type: string
      region:
        example: Addis Ababa
        type: string
      tier_level:
        allOf:
        - $ref: '#/definitions/entity.HospitalTier'
        example: SPECIALIZED
    type: object
  handlers.UpdateUserRequest:
    properties:
      department_id:
        example: dfc2b777-a5d5-424b-911a-976b2e8d8614
        type: string
      email:
        example: analyst@moh.gov.et
        type: string
      first_name:
        example: MoH
        type: string
      hospital_id:
        example: 0f74f069-d52d-4482-9ba5-41b007fdc1e5
        type: string
      is_active:
        example: true
        type: boolean
      last_name:
        example: Analyst
        type: string
      national_id:
        example: MOH-001
        type: string
      role:
        allOf:
        - $ref: '#/definitions/entity.UserRole'
        example: MOH_ANALYST
    type: object
info:
  contact: {}
  description: API for managing hospital referrals, users, hospitals, and departments.
  title: Hospital Referral System API
  version: "1.0"
paths:
  /api/v1/admin/network-routes:
    get:
      description: Retrieve all routing rules, optionally filtered by sender hospital.
        Only HOSPITAL_ADMIN can view admin routes.
      parameters:
      - description: Filter by Sender Hospital ID
        in: query
        name: sender_hospital_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.NetworkRouteListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List Network Routes
      tags:
      - Network Routes (Admin)
    post:
      consumes:
      - application/json
      description: Define a routing rule linking two hospitals. Only HOSPITAL_ADMIN
        can create routes.
      parameters:
      - description: Network routing rule payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateNetworkRouteRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.NetworkRouteResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create Network Route
      tags:
      - Network Routes (Admin)
  /api/v1/admin/network-routes/{id}:
    delete:
      description: Remove a referral network routing rule. Only HOSPITAL_ADMIN can
        delete routes.
      parameters:
      - description: Route ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete Network Route
      tags:
      - Network Routes (Admin)
  /api/v1/attachments/{id}/download:
    get:
      description: Stream actual binary file data for an attachment ID
      parameters:
      - description: Attachment ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Download Attachment
      tags:
      - Attachments
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate a user and return access/refresh token pair
      parameters:
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Token pair
          schema:
            $ref: '#/definitions/dto.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: User login
      tags:
      - Auth
  /api/v1/auth/logout:
    post:
      consumes:
      - application/json
      description: Revoke both access and refresh tokens
      parameters:
      - description: Refresh token to revoke
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: User logout
      tags:
      - Auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: Exchange a valid refresh token for a new access/refresh token pair
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: New token pair
          schema:
            $ref: '#/definitions/dto.RefreshResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Refresh token
      tags:
      - Auth
  /api/v1/departments:
    get:
      description: List departments with optional search
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Page size
        in: query
        name: page_size
        type: integer
      - description: Search by name
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.DepartmentListResponse'
      security:
      - BearerAuth: []
      summary: List departments
      tags:
      - Departments
    post:
      consumes:
      - application/json
      description: Admin-only endpoint to create a department
      parameters:
      - description: Department creation payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateDepartmentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.DepartmentResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a new department
      tags:
      - Departments
  /api/v1/departments/{id}:
    delete:
      description: Admin-only endpoint to delete a department
      parameters:
      - description: Department ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a department
      tags:
      - Departments
    get:
      description: Retrieve a department by its ID
      parameters:
      - description: Department ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.DepartmentResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get department by ID
      tags:
      - Departments
    put:
      consumes:
      - application/json
      description: Admin-only endpoint to update department information
      parameters:
      - description: Department ID
        in: path
        name: id
        required: true
        type: string
      - description: Department update payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateDepartmentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.DepartmentResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a department
      tags:
      - Departments
  /api/v1/doctor/latest-pending:
    get:
      description: Get a list of the most recent pending referrals for the doctor's
        dashboard.
      parameters:
      - default: 5
        description: Number of records to fetch
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.LatestPendingReferralsResponse'
      security:
      - BearerAuth: []
      summary: Get Latest Pending Referrals
      tags:
      - Doctor Dashboard
  /api/v1/doctor/referrals:
    get:
      description: Get a paginated list of referrals created by the authenticated
        doctor.
      parameters:
      - default: 20
        description: Pagination limit
        in: query
        name: limit
        type: integer
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - description: Filter by status
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PaginatedReferralResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List Referrals for Doctor
      tags:
      - Doctor Referrals
    post:
      consumes:
      - application/json
      description: Create a new referral draft or submit it directly based on the
        status provided.
      parameters:
      - description: Referral Details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateReferralRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.ReferralDetailResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create or Submit Referral
      tags:
      - Doctor Referrals
  /api/v1/doctor/referrals/{id}:
    get:
      description: Get detailed information about a specific referral created by the
        doctor.
      parameters:
      - description: Referral ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ReferralDetailResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get Referral Details for Doctor
      tags:
      - Doctor Referrals
    put:
      consumes:
      - application/json
      description: Allows updating a referral. Saving without the /submit suffix persists
        changes as a DRAFT. Adding /submit finalizes the referral and moves it to
        SUBMITTED status for liaison processing.
      parameters:
      - description: Referral ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated Referral Details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateReferralRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ReferralDetailResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update (Draft) or Submit Referral
      tags:
      - Doctor Referrals
  /api/v1/doctor/referrals/{id}/cancel:
    post:
      consumes:
      - application/json
      description: Cancel an active referral that has not yet been processed (must
        be in DRAFT or NEED_REVISION status).
      parameters:
      - description: Referral ID
        in: path
        name: id
        required: true
        type: string
      - description: Cancellation Reason
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CancelReferralRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Cancel Referral
      tags:
      - Doctor Referrals
  /api/v1/doctor/referrals/{id}/submit:
    put:
      consumes:
      - application/json
      description: Allows updating a referral. Saving without the /submit suffix persists
        changes as a DRAFT. Adding /submit finalizes the referral and moves it to
        SUBMITTED status for liaison processing.
      parameters:
      - description: Referral ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated Referral Details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateReferralRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ReferralDetailResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update (Draft) or Submit Referral
      tags:
      - Doctor Referrals
  /api/v1/doctor/stats:
    get:
      description: Get a summary of referral counts (Total, Pending, Accepted, Critical)
        for the doctor's dashboard.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.DoctorDashboardStatsResponse'
      security:
      - BearerAuth: []
      summary: Get Doctor Dashboard Stats
      tags:
      - Doctor Dashboard
  /api/v1/hospital-admin/referrals-log:
    get:
      description: Get audit logs of all referral status transitions connected to
        the hospital.
      parameters:
      - default: 20
        description: Pagination limit
        in: query
        name: limit
        type: integer
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PaginatedLogResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get Referral Logs for Hospital
      tags:
      - Admin Referrals
  /api/v1/hospitals:
    get:
      description: List hospitals with optional filters
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Page size
        in: query
        name: page_size
        type: integer
      - description: Filter by tier level
        in: query
        name: tier
        type: string
      - description: Filter by region
        in: query
        name: region
        type: string
      - description: Filter by active status
        in: query
        name: is_active
        type: boolean
      - description: Search by name
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.HospitalListResponse'
      security:
      - BearerAuth: []
      summary: List hospitals
      tags:
      - Hospitals
    post:
      consumes:
      - application/json
      description: Admin-only endpoint to create a hospital
      parameters:
      - description: Hospital creation payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateHospitalRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.HospitalResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a new hospital
      tags:
      - Hospitals
  /api/v1/hospitals/{id}:
    delete:
      description: Admin-only endpoint to soft-delete a hospital
      parameters:
      - description: Hospital ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a hospital
      tags:
      - Hospitals
    get:
      description: Retrieve a hospital by its ID
      parameters:
      - description: Hospital ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.HospitalResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get hospital by ID
      tags:
      - Hospitals
    put:
      consumes:
      - application/json
      description: Admin-only endpoint to update hospital information
      parameters:
      - description: Hospital ID
        in: path
        name: id
        required: true
        type: string
      - description: Hospital update payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateHospitalRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.HospitalResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a hospital
      tags:
      - Hospitals
  /api/v1/hospitals/{id}/departments:
    get:
      description: Retrieve all departments linked to a specific hospital
      parameters:
      - description: Hospital ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.HospitalDepartmentListResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List departments of a hospital
      tags:
      - Hospitals
    post:
      consumes:
      - application/json
      description: Admin-only endpoint to associate a department with a hospital
      parameters:
      - description: Hospital ID
        in: path
        name: id
        required: true
        type: string
      - description: Link payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.LinkDepartmentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Link a department to a hospital
      tags:
      - Hospitals
  /api/v1/hospitals/{id}/departments/{deptId}:
    delete:
      description: Admin-only endpoint to remove a department-hospital association
      parameters:
      - description: Hospital ID
        in: path
        name: id
        required: true
        type: string
      - description: Department ID
        in: path
        name: deptId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Unlink a department from a hospital
      tags:
      - Hospitals
  /api/v1/liaison/referrals:
    get:
      description: Get a paginated list of referrals sent FROM the liaison's hospital
        for review.
      parameters:
      - default: 20
        description: Pagination limit
        in: query
        name: limit
        type: integer
      - default: 1
        description: Page number
        in: query
