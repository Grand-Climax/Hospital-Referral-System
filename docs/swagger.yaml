      - description: Filter by patient region
        in: query
        name: region
        type: string
      - description: Filter by patient ID
        in: query
        name: patient_id
        type: string
      - description: Filter by patient national ID
        in: query
        name: national_id
        type: string
      - default: created_at
        description: Sort by field (created_at, updated_at)
        in: query
