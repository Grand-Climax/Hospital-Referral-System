        **Roles:** DEPT_HEAD (scoped to the authenticated user's hospital + department)

        **Prerequisites:**
        - target_date must be >= today + system_configs.buffer_days + 1 (default buffer is 2 days)
        - new_limit must be >= 0
        - no other active override may exist for the same (hospital, department, date)

        **Side Effects:**
        - On the next ScheduleAppointment / ManualEmergencySchedule / BatchSchedule for that date, getEffectiveCapacity will use new_limit instead of HospitalDepartment.StandardDailyLimit.
        - No DailySchedule rows are created here; one is logged lazily on the first booking for that date.
        - Emits a CAPACITY_OVERRIDE_CREATED in-app notification and an audit log row.

        **Common Errors:**
