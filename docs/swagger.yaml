  /api/v1/department-head/schedule/batch:
    post:
      description: |-
        Walks the department's waiting queue and books each patient into the earliest available slot in [today + buffer_days, today + buffer_days + max_horizon_days].

        **Roles:** DEPT_HEAD (scoped to caller's hospital + department).

        **Prerequisites:**
        - WAITING TriageQueue rows for the department (AppointmentDate IS NULL, ArrivalStatus = EXPECTED).
        - system_configs.buffer_days (default 2) and system_configs.max_horizon_days (default 30).

        **Capacity Rule:** Routine - booked < maxSlots. Overbook capacity is never used here.
        For each candidate date the helper re-evaluates getEffectiveCapacity, so concurrent emergency bookings are honored.

        **State Transitions per booking:**
        - TriageQueue.AppointmentDate set, ArrivalStatus = EXPECTED.
        - Referral.Status -> SCHEDULED with a ReferralStatusHistory row.
        - DailySchedule snapshot row created/updated for the target date.

        **Side Effects:**
        - Per-booking SMS via NotifyScheduling (when auto_notify or sendNotifications=true).
        - One audit row with the aggregated result.
        - One in-app BATCH_SCHEDULE_COMPLETED event when at least one patient was placed.

        **Soft lease:** A 5-minute lease is acquired via SchedulerCheckpointRepository before any work begins. If another batch run is in progress for the same (hospital, department), this call returns 200 with `{ scheduled_count: 0, waiting_count: 0, message: "Batch already running for this department; try again in a few minutes" }` rather than racing.

        **Common Errors:**
        - 401 Unauthorized / scope missing
        - 500 Internal Server Error
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.BaseResponse'
      security:
      - BearerAuth: []
      summary: Run batch scheduling (Schedule-on-Demand, no overbook)
      tags:
      - Department Head
