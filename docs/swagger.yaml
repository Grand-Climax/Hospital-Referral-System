        - 400 invalid or missing date
        - 401 Unauthorized
        - 500 Internal Server Error
      parameters:
      - description: Target date (YYYY-MM-DD)
        in: query
        name: date
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
