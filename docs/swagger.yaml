    get:
      description: |-
        Returns the triage rows scheduled for the given date in any "occupying-the-slot" arrival status (Expected, Arrived, Admitted). Referral + Patient are eagerly loaded so the UI can render names without a follow-up call.

        **Roles:** DEPT_HEAD

        **Prerequisites:** Authenticated DEPT_HEAD session. date must be YYYY-MM-DD.

        **Side Effects:** None. Read-only.

