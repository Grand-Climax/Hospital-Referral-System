  /api/v1/specialist/referrals/{id}/emergency-schedule:
    post:
      consumes:
      - application/json
      description: |-
        Books a referral as an emergency for a specific date. This is the ONLY scheduling path allowed to consume overbook capacity.

        **Roles:** RECEIVING_SPECIALIST

        **Prerequisites:**
        - Referral.Status must be ACCEPTED or SCHEDULED.
        - TriageQueue.ArrivalStatus must be EXPECTED or MISSED (already-ARRIVED / ADMITTED patients are blocked).
        - Appointment date must be today or in the future.
        - Either Referral.ReferralForm.condition_at_referral = "critical" OR a non-empty justification must be provided.

        **Capacity Rule (Schedule-on-Demand):**
        - booked count is read live from TriageQueue (Expected/Arrived/Admitted) via CountByDeptAndDate.
        - maxSlots = active CapacityOverride.NewLimit OR HospitalDepartment.StandardDailyLimit.
        - overbookLimit = HospitalDepartment.OverbookLimit.
        - Rejected when booked >= maxSlots + overbookLimit.

        **State Transitions:**
        - Referral.Status: ACCEPTED/SCHEDULED -> SCHEDULED.
        - TriageQueue.ArrivalStatus: MISSED -> EXPECTED (rescheduled_from_missed=true) or unchanged.
        - TriageQueue.AppointmentDate set to the target date.

        **Side Effects:**
        - Creates or updates the DailySchedule snapshot row for the (hospital, department, date).
        - Writes an audit log row with action EMERGENCY_SCHEDULE.
        - Queues SMS via NotifyScheduling / NotifyMissedReschedule.
        - Dispatches in-app event APPOINTMENT_SCHEDULED or MISSED_APPOINTMENT_RESCHEDULED.

        **Common Errors:**
        - 400 invalid referral ID / past date / not critical and no justification
        - 401 Unauthorized
        - 500 capacity full even with overbook / DB error
      parameters:
      - description: Referral ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Emergency scheduling details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ManualEmergencyScheduleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.SchedulingResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Manual emergency schedule (Schedule-on-Demand, overbook allowed)
      tags:
      - Specialist
  /api/v1/specialist/referrals/{id}/ml-prediction:
    get:
      description: |-
        Get the machine learning prediction details for a specific referral, containing inputs and outputs.
        **Roles:** RECEIVING_SPECIALIST
        **Visibility:** The specialist must belong to the target hospital of the referral.
        **Prerequisites:** Referral must exist at the specialist's target hospital.
