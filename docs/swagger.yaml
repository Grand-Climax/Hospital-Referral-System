        - 401 Unauthorized
      parameters:
      - description: Referral ID
        in: path
        name: id
        required: true
        type: string
      - description: Checklist Updates
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ReviewChecklistRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
