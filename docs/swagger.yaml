info:
  contact: {}
  description: |-
    # Hospital Referral Hub API
    A national‑scale hospital referral management platform that digitises the entire patient‑transfer workflow, from initial doctor referral to final clinical outcome. All actions are governed by strict role‑based access controls and clinical governance rules.

    ---
    ## Referral Lifecycle
    DRAFT → SUBMITTED → (Liaison) UNDER_LIAISON_REVIEW → FORWARDED
    ↘ REJECTED_BY_LIAISON
    FORWARDED → (Specialist) UNDER_SPECIALIST_REVIEW → ACCEPTED / REJECTED_BY_SPECIALIST
    ACCEPTED → SCHEDULED → ASSIGNED → COMPLETED
    ↘ MISSED / RESCHEDULED / DECEASED

    ---
    ## Visibility Rules

    | Status | Visible To |
    |----------------------|-----------|
    | DRAFT / NEED_REVISION | Referring Doctor only |
    | SUBMITTED … FORWARDED | Liaison of the sender hospital |
    | FORWARDED … COMPLETED | Specialists of the target hospital |
    | ACCEPTED … SCHEDULED | Receptionists of the target hospital |
    | All statuses | System Admins (global); MoH Analysts (aggregated dashboards, no raw clinical data) |

    ---
    ## Critical Business Rules

    - **ML Triage Gate**: On submit, the backend calls the ML service (`POST /score`) asynchronously. A referral cannot be accepted while `ml_status` is PENDING, or without a severity score (from ML or manual `POST /specialist/referrals/{id}/ml-severity-override`).
    - **Duplicate Prevention**: A patient may not have more than one active referral (status not COMPLETED, CANCELLED, REJECTED_*, DECEASED) to the same target department. The API returns 409 Conflict.
    - **Walk‑in Restriction**: Walk‑ins can only be registered for referrals in ACCEPTED or SCHEDULED status.
    - **Emergency Scheduling**: Bypasses buffer days and allows overbooking up to `overbook_limit`. Requires critical condition or explicit justification.
    - **Deceased Outcome**: Recording a deceased outcome sets the referral to DECEASED, soft‑archives it (`is_archived=true`), and cancels any pending appointments.
    - **Cancel After Send**: A doctor may cancel a referral after sending (REJECTED_AFTER_SEND) only if it has not been accepted yet.

    For detailed per‑endpoint rules, see the individual endpoint descriptions below.
  title: Hospital Referral System API
  version: "1.0"
paths:
  /api/v1/admin/config:
    get:
      description: |-
        Retrieve all system-wide runtime configuration keys (e.g., buffer_days, aging_factor, overbook_limit).
        **Roles:** SYSTEM_SUPER_ADMIN
        **Prerequisites:** Authenticated session.
        **Common Errors:**
        - 401 Unauthorized
        - 403 Forbidden (not super admin)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get System Configuration
      tags:
      - System Admin
    put:
      consumes:
      - application/json
      description: |-
        Update system-wide runtime configuration values.
        **Roles:** SYSTEM_SUPER_ADMIN
        **State Transition:** Immediately affects scheduling logic and triage weight calculations.
        **Common Keys:** buffer_days, aging_factor, max_horizon_days, overbook_limit_default.
        **Common Errors:**
        - 400 invalid key or value format
        - 403 forbidden (not super admin)
      parameters:
      - description: Key-value pairs to update
        in: body
        name: updates
        required: true
        schema:
          additionalProperties:
            type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.BaseResponse'
      security:
      - BearerAuth: []
      summary: Update System Configuration
      tags:
      - System Admin
  /api/v1/admin/network-routes:
    get:
      description: |-
        Retrieve all routing rules, optionally filtered by sender hospital. Only HOSPITAL_ADMIN can view admin routes.
        **Roles:** SYSTEM_SUPER_ADMIN, HOSPITAL_ADMIN
        **Common Errors:**
        - 400 invalid filter format
        - 500 Internal Server Error
      parameters:
      - description: Filter by Sender Hospital ID
        in: query
        name: sender_hospital_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.NetworkRouteListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List Network Routes
      tags:
      - Network Routes (Admin)
    post:
      consumes:
      - application/json
      description: |-
        Define a routing rule linking two hospitals. Only SYSTEM_SUPER_ADMIN can create global network routes.
        **Roles:** SYSTEM_SUPER_ADMIN
        **Common Errors:**
        - 400 invalid input
        - 500 Internal Server Error
      parameters:
      - description: Network routing rule payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.CreateNetworkRouteRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.NetworkRouteResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create Network Route
      tags:
      - Network Routes (Admin)
  /api/v1/admin/network-routes/{id}:
    delete:
      description: |-
        Remove a referral network routing rule. Only SYSTEM_SUPER_ADMIN can delete routes.
        **Roles:** SYSTEM_SUPER_ADMIN
        **Common Errors:**
        - 400 invalid ID format
        - 500 Internal Server Error
      parameters:
      - description: Route ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete Network Route
      tags:
      - Network Routes (Admin)
  /api/v1/attachments/{id}:
    get:
      description: |-
        Retrieve metadata for a specific attachment by its ID.
        **Roles:** All authenticated roles with referral access.
        **Common Errors:**
        - 404 Not Found
      parameters:
      - description: Attachment ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.AttachmentResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get Attachment Details
      tags:
      - Attachments
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: |-
        Authenticate with email/password, then send OTP through configured MFA channel.
        **Roles:** Any user with an active account.
        **Common Errors:**
        - 401 (Invalid Credentials)
        - 401 (Account Inactive)
      parameters:
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_delivery_http_handlers.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: MFA intermediate token and channel
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ErrorResponse'
      summary: User login
      tags:
      - Authentication
  /api/v1/auth/logout:
    post:
      consumes:
      - application/json
      description: |-
        Revoke both access and refresh tokens. Blacklists the tokens to prevent further use.
        **Roles:** Any authenticated user.
        **Prerequisites:** Requires a valid Access Token in Authorization header.
        **Common Errors:**
        - 401 Unauthorized
        - 500 Internal Server Error
      parameters:
      - description: Refresh token to revoke
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_delivery_http_handlers.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: User logout
      tags:
      - Authentication
  /api/v1/auth/mfa/verify:
    post:
      consumes:
      - application/json
      description: Verify one-time code from configured channel and issue full access
        tokens.
      parameters:
      - description: OTP verification payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_delivery_http_handlers.MFAVerifyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Token pair
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.MFAVerifyResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Verify OTP
      tags:
      - Authentication
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: |-
        Exchange a valid refresh token for a new access/refresh token pair. Used to maintain session without re-login.
        **Roles:** Any user with a valid refresh token.
        **Constraints:** Refresh token must not be blacklisted or expired.
        **Common Errors:**
        - 401 Unauthorized (token invalid/expired)
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_delivery_http_handlers.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: New token pair
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.RefreshResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ErrorResponse'
      summary: Refresh token
      tags:
      - Authentication
  /api/v1/chat/contacts:
    get:
      description: |-
        Retrieve a paginated and searchable list of active users that the authenticated caller is legally authorized to chat with based on role visual boundaries, active access grants, and clinical referral relationships.

        ### Contact Search Modes:

        #### 1. Same-Hospital Mode (Without `referral_id`)
        Returns colleagues working at the **same hospital** as the caller:
        - **Self-Exclusion:** The caller is never included in the contact list.
        - **Specialist Visibility:** Specialists can only see referring doctors to whom they have **active access** (via accepted referrals or explicit access grants).
        - **Liaison Officer / Receptionist / Dept Head:** Follow standard hospital-wide visual scopes.
        - **Admin & Super-Admin:** Standard administrative and super-admin visual bounds.
        - **System Constraints:** Excludes `MOH_ANALYST` completely and excludes `SYSTEM_SUPER_ADMIN` (unless the caller themselves is a super-admin).

        #### 2. Cross-Hospital Mode (With `referral_id`)
        Returns eligible clinical contacts at the **opposite hospital** involved in that specific referral context:
        - **Visually Scoped Roles:** Limit eligible chat contacts to:
        - The referring doctor who created/managed the referral.
        - Liaison officers at the target hospital.
        - Specialists with active access or assignment to the referral.
        - The target department head and the target hospital administrator.
        - **Access Gate:** The caller must have permission to access the referral to use this mode.

        ### Filtering & Search Options:
        - **`search`:** Filter users dynamically by first name, middle name, or last name.
        - **`role`:** Limit contacts to a specific user role (e.g., `RECEIVING_SPECIALIST`, `REFERRING_DOCTOR`).

        ### System Constraints:
        - `MOH_ANALYST` users are completely barred from using or being returned by this endpoint.
      parameters:
      - description: Referral UUID to list eligible cross-hospital contacts for a
          referral
        in: query
        name: referral_id
        type: string
      - description: Search pattern targeting first, middle, or last names of contacts
        in: query
        name: search
        type: string
      - description: Filter by specific user role (e.g., REFERRING_DOCTOR)
        in: query
        name: role
        type: string
      - description: Pagination limit (default 50)
        in: query
        name: limit
        type: integer
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.PaginatedContactResponse'
        "400":
          description: Invalid referral ID, unauthorized role, or access boundaries
            violation
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ErrorResponse'
        "403":
          description: MOH Analyst role completely blocked
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ErrorResponse'
        "500":
          description: Internal database lookup error
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List Eligible Chat Contacts
      tags:
      - Chat
  /api/v1/chat/conversations:
    get:
      description: |-
        Retrieve a paginated list of all active direct and referral-scoped chat channels involving the authenticated user.

        ### Features & Fields:
        - Shows the latest message preview, unread message count for the current user, and other participant metadata.
        - **`is_read_only` (bool):** Set to `true` if the channel is referral-scoped and has reached a terminal state.
        - **`is_disabled` (bool):** Set to `true` if an administrator has locked the channel.

        ### Roles:
        - Accessible by all authenticated roles except `MOH_ANALYST`.
      parameters:
      - default: 20
        description: Pagination limit (safe sanitized minimum of 1)
        in: query
        name: limit
        type: integer
      - default: 1
        description: Page number (safe sanitized minimum of 1)
        in: query
        name: page
        type: integer
      - description: 'Filter by conversation type: all (default), direct (no referral),
          referral (scoped to a referral)'
        in: query
        name: type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.PaginatedConversationResponse'
        "401":
          description: 'Unauthorized: Invalid session token'
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ErrorResponse'
        "500":
          description: Internal database retrieval error
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List My Conversations
      tags:
      - Chat
  /api/v1/chat/conversations/{id}:
    delete:
      description: |-
        Administratively soft-delete a chat conversation, hiding it from participants while preserving GORM DB records for clinical auditing.

        ### Role & Boundary Security:
        - **System Super Admin:** Global permission to soft-delete any conversation.
        - **Hospital Admin:** Authorized **only** for conversations involving their hospital's staff or active referrals.
        - **Other Roles:** Rejected with `403 Forbidden`.
        - **Audit Trail:** Registers a system audit log capturing the deletion event.
      parameters:
      - description: Conversation UUID to soft-delete
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.BaseResponse'
        "400":
          description: Invalid or malformed conversation ID
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ErrorResponse'
        "403":
          description: Unauthorized boundary violation, or non-admin role attempt
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ErrorResponse'
        "500":
          description: Internal soft-delete execution failure
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Soft-delete Conversation (Admin)
      tags:
      - Chat
  /api/v1/chat/conversations/{id}/toggle-disabled:
    put:
      consumes:
      - application/json
      description: |-
        Administratively lock or unlock a chat channel. Locking a channel (`is_disabled = true`) prevents any further message sending while maintaining read history access.

        ### Role & Boundary Security:
        - **System Super Admin:** Authorized to lock/unlock any conversation globally without restriction.
        - **Hospital Admin:** Authorized to lock/unlock conversations **only** if they involve a participant or a referral associated with their hospital. Access from outside this boundary is rejected.
        - **Other Roles:** Rejected with `403 Forbidden`.
        - **Audit Logging:** Triggers an immutable system audit log entry capturing the change state and reason.
      parameters:
      - description: Conversation UUID to modify
        in: path
        name: id
        required: true
        type: string
      - description: Lock state toggle (`is_disabled`) and mandatory action justification
          reason
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_delivery_http_handlers.ToggleDisabledRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.BaseResponse'
        "400":
          description: Invalid conversation ID, or missing required justification
            reason
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ErrorResponse'
        "403":
          description: Unauthorized admin boundary violation, or non-admin role attempt
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ErrorResponse'
        "500":
          description: Internal update or audit logging failure
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Toggle Conversation Lock State (Admin)
      tags:
      - Chat
  /api/v1/chat/messages:
    get:
      description: |-
        Retrieve the message logs for a conversation. If conversation ID is not provided, the system automatically resolves or creates the unique channel using `other_user_id` and optional `referral_id`.

        ### Security & Administrative Auditing (Spying):
        - **Normal Participants:** Allowed to view conversations they are registered members of.
        - **Hospital Admins:** Authorized to view/audit message history if the chat involves staff of their hospital or a referral linked to their hospital.
        - **System Super Admins:** Unrestricted access to view any conversation globally.
        - **Other Roles:** Third-party access is rejected with `403 Forbidden`.

        ### Auto-Read side-effect:
        - Querying messages automatically marks all unread messages in that channel as read for the calling user, updating badge states.
      parameters:
      - description: Conversation UUID to load history directly
        in: query
        name: conversation_id
        type: string
      - description: Recipient UUID to resolve direct or referral channel
        in: query
        name: other_user_id
        type: string
      - description: Referral UUID to scope the conversation search
        in: query
        name: referral_id
        type: string
      - default: 20
        description: Pagination limit
        in: query
        name: limit
        type: integer
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.PaginatedChatResponse'
        "400":
          description: Missing both conversation_id and other_user_id, or malformed
            UUIDs
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ErrorResponse'
        "403":
          description: 'Unauthorized: Boundary check violation or non-participant
            access'
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ErrorResponse'
        "500":
          description: Internal data processing failure
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get Message History & Auto-Read
      tags:
      - Chat
    post:
      consumes:
      - application/json
      description: |-
        Send a real-time message to another user, either as a direct peer-to-peer message or scoped to a specific clinical referral context.

        ### Security & Role Authorization Matrix:
        - **Allowed Roles:** `SYSTEM_SUPER_ADMIN`, `HOSPITAL_ADMIN`, `REFERRING_DOCTOR`, `RECEIVING_SPECIALIST`, `LIAISON_OFFICER`, `RECEPTIONIST`, `DEPT_HEAD`.
        - **Barred Roles:** `MOH_ANALYST` is strictly forbidden from participating in or receiving chat messages.
        - **Receptionist Boundaries:** Receptionists cannot initiate peer chats, and can only receive messages from clinical staff (Doctors/Specialists) inside their own hospital.

        ### Scoped/Referral Chat Restrictions:
        - **Access Control:** If `referral_id` is supplied, both sender and receiver must be connected to the referral (creator, treating/consulting doctor, department head, liaison, or user with active access grant).
        - **Terminal States (Read-Only):** The chat room becomes strictly read-only if the referral status is terminal (`COMPLETED`, `DECEASED`, `CANCELLED`, `REJECTED_BY_LIAISON`, `REJECTED_BY_SPECIALIST`, `REJECTED_AFTER_SEND`, `REDIRECTED`).

        ### Direct (Non-Referral) Peer Chat Initiation:
        - **Referring Doctor:** Can initiate with own hospital colleagues, liaison officer at a hospital with active referral, or specialists with active access/accepted referrals.
        - **Liaison Officer:** Can initiate with referring doctors of active referrals, or specialists if a network route exists between their hospitals.
        - **Receiving Specialist:** Can only initiate if they have active access to the doctor's referrals.
        - **Hospital Admin:** Can only initiate with staff of their own hospital.

        ### Prerequisites:
        - Receiver account must be active and not soft-deleted.
        - Content must be non-empty and between 1 and 5000 characters.
        - Sender and receiver must not be the same user.
        - Conversation must not be administrative-locked.
      parameters:
      - description: Message details including receiver, optional referral context,
          and content text
        in: body
        name: message
        required: true
        schema:
          $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.SendMessageRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ChatMessageResponse'
        "400":
          description: Invalid parameters, empty content, content > 5000 chars, self-send,
            or inactive recipient
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ErrorResponse'
        "403":
          description: Unauthorized role, multi-hospital boundary violation, terminal
            referral (read-only), or admin locked
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ErrorResponse'
        "404":
          description: Referral not found
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ErrorResponse'
        "500":
          description: Internal database or transmission error
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Send Chat Message
      tags:
      - Chat
