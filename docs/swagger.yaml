  /api/v1/referrals/{id}/attachments:
    get:
      description: |-
        Get all attachments associated with a specific referral.
        **Roles:** All authenticated roles with referral access.
        **Common Errors:**
        - 404 Referral not found
      parameters:
      - description: Referral ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.AttachmentListResponse'
      security:
      - BearerAuth: []
      summary: List Referral Attachments
      tags:
      - Attachments
    post:
      consumes:
      - multipart/form-data
      description: |-
        Upload a single clinical file to an existing referral. The file is immediately verified and stored permanently.

        **Request format:** multipart/form-data
        - **file**: The file to upload (max 20MB).
        - **category**: Category for the attachment (e.g., RADIOLOGY, LAB_REPORT, DICOM_XRAY). Defaults to GENERAL_CLINICAL.

        **Verification:** DICOM and PDF files are checked for valid metadata.
        - On success: attachment status set to VERIFIED.
        - On failure: attachment status set to REJECTED and referral moves to NEED_REVISION.

        **Roles:** REFERRING_DOCTOR
        **Prerequisites:** Referral must be in DRAFT or NEED_REVISION status.
        **Common Errors:**
        - 400 Invalid ID or file too large (> 20MB)
        - 403 Forbidden (not the creator or invalid status)
      parameters:
      - description: Referral ID
        in: path
        name: id
        required: true
        type: string
      - description: File to upload
        in: formData
        name: file
        required: true
        type: file
      - description: Category (e.g. RADIOLOGY, LAB_REPORT, DICOM_XRAY)
        in: formData
        name: category
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.AttachmentListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Upload Attachment to Referral
      tags:
      - Attachments
