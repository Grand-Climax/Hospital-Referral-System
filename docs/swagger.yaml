        - 403 (no clinical access)
      parameters:
      - description: Referral ID
        in: path
        name: id
        required: true
        type: string
      - description: Outcome details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.RecordOutcomeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Record Referral Outcome
      tags:
      - Clinical
