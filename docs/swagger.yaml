  /api/v1/specialist/referrals/{id}/ml-severity-override:
    post:
      consumes:
      - application/json
      description: |-
        Allows a specialist to manually override the machine learning model's severity score for a patient referral.
        This action sets the referral's machine learning pipeline status (`ml_status`) to MANUAL, updates the referral's severity score,
        deletes any existing automated ML predictions for this referral to ensure data integrity, and recalculates the priority composite score in the triage queue.
        **Roles:** RECEIVING_SPECIALIST
        **Prerequisites:** The referral must belong to the specialist's target hospital and department.
        **Side Effects:** Changes `ml_status` to MANUAL, sets `triage_status` to OVERRIDDEN, clears active ML prediction association, and updates the triage composite score.
        **Common Errors:**
        - 400 Bad Request: Invalid referral ID format or malformed request payload
        - 401 Unauthorized: Invalid or missing authorization token
        - 403 Forbidden: Specialist does not belong to the target hospital/department of the referral
        - 500 Internal Server Error: Database transaction failures
      parameters:
      - description: Referral ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Manual override parameters including new score and clinical justification
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.MLSeverityOverrideRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Severity score manually overridden and triage queue successfully
            updated
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.BaseResponse'
        "400":
          description: Invalid inputs / bad request format
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ErrorResponse'
        "401":
          description: Unauthorized access
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ErrorResponse'
        "403":
          description: Forbidden operation / mismatching hospital scopes
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ErrorResponse'
        "500":
          description: Internal server / database transaction error
          schema:
            $ref: '#/definitions/Hospital-Referral-System_internal_delivery_http_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Manual ML Severity Override
      tags:
      - Specialist
  /api/v1/specialist/referrals/{id}/read:
